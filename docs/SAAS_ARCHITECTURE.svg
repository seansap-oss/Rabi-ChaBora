<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/></filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#fafaf9"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="bold" fill="#1c1917">CafeOS SaaS Architecture</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" fill="#78716c">Shared Codebase + Multi-Tenant = One Deployment, Unlimited Cafes</text>

  <!-- ============================================ -->
  <!-- ROW 1: CUSTOMER JOURNEY -->
  <!-- ============================================ -->
  
  <!-- Step 1: Landing Page -->
  <rect x="30" y="100" width="170" height="100" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="30" y="100" width="170" height="6" rx="16" fill="url(#hero)"/>
  <text x="115" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">1. LANDING PAGE</text>
  <text x="115" y="148" text-anchor="middle" font-size="10" fill="#78716c">cafeos.avitsolutions.tech</text>
  <text x="115" y="165" text-anchor="middle" font-size="10" fill="#78716c">Features, Pricing, Demo</text>
  <text x="115" y="182" text-anchor="middle" font-size="10" fill="#78716c">"Start Free Trial"</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="150" x2="230" y2="150" stroke="#d6d3d1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d6d3d1"/></marker></defs>

  <!-- Step 2: Sign Up -->
  <rect x="240" y="100" width="170" height="100" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="240" y="100" width="170" height="6" rx="16" fill="url(#green)"/>
  <text x="325" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">2. SIGN UP</text>
  <text x="325" y="148" text-anchor="middle" font-size="10" fill="#78716c">Name + Email + Phone</text>
  <text x="325" y="165" text-anchor="middle" font-size="10" fill="#78716c">Auto-creates: cafeId</text>
  <text x="325" y="182" text-anchor="middle" font-size="10" fill="#78716c">Free trial starts</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="150" x2="440" y2="150" stroke="#d6d3d1" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Onboarding -->
  <rect x="450" y="100" width="170" height="100" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="450" y="100" width="170" height="6" rx="16" fill="url(#purple)"/>
  <text x="535" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">3. ONBOARDING</text>
  <text x="535" y="148" text-anchor="middle" font-size="10" fill="#78716c">Upload logo, set theme</text>
  <text x="535" y="165" text-anchor="middle" font-size="10" fill="#78716c">Add menu items</text>
  <text x="535" y="182" text-anchor="middle" font-size="10" fill="#78716c">Set UPI + phone</text>

  <!-- Arrow 3 -->
  <line x1="620" y1="150" x2="650" y2="150" stroke="#d6d3d1" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Get URL -->
  <rect x="660" y="100" width="170" height="100" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="660" y="100" width="170" height="6" rx="16" fill="url(#hero)"/>
  <text x="745" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">4. GET YOUR URL</text>
  <text x="745" y="148" text-anchor="middle" font-size="10" fill="#78716c">cafeos.avitsolutions.tech/mymoon</text>
  <text x="745" y="165" text-anchor="middle" font-size="10" fill="#78716c">+ QR codes generated</text>
  <text x="745" y="182" text-anchor="middle" font-size="10" fill="#78716c">Print QR → put on tables</text>

  <!-- Arrow 4 -->
  <line x1="830" y1="150" x2="860" y2="150" stroke="#d6d3d1" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 5: Go Live -->
  <rect x="870" y="100" width="170" height="100" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="870" y="100" width="170" height="6" rx="16" fill="url(#green)"/>
  <text x="955" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">5. GO LIVE!</text>
  <text x="955" y="148" text-anchor="middle" font-size="10" fill="#78716c">Customers scan QR</text>
  <text x="955" y="165" text-anchor="middle" font-size="10" fill="#78716c">Orders flow to POS</text>
  <text x="955" y="182" text-anchor="middle" font-size="10" fill="#78716c">Money starts flowing</text>

  <!-- ============================================ -->
  <!-- ROW 2: ARCHITECTURE -->
  <!-- ============================================ -->
  
  <text x="30" y="250" font-size="14" font-weight="bold" fill="#1c1917">Architecture</text>
  
  <!-- Cafe 1 -->
  <rect x="30" y="270" width="260" height="180" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="30" y="270" width="260" height="8" rx="16" fill="url(#hero)"/>
  <text x="160" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c1917">Cafe A: "Moon Coffee"</text>
  <text x="160" y="318" text-anchor="middle" font-size="10" fill="#78716c">mymoon.cafeos.app</text>
  <line x1="50" y1="330" x2="270" y2="330" stroke="#f5f5f4"/>
  <text x="50" y="348" font-size="10" fill="#57534e">Theme: Brown &amp; Gold</text>
  <text x="50" y="366" font-size="10" fill="#57534e">Menu: 45 items, 6 categories</text>
  <text x="50" y="384" font-size="10" fill="#57534e">Loyalty: Buy 8 Get 1 Free</text>
  <text x="50" y="402" font-size="10" fill="#57534e">WhatsApp: 5 features ON</text>
  <text x="50" y="420" font-size="10" fill="#57534e">Users: Owner + 2 staff</text>
  <text x="50" y="438" font-size="10" fill="#a8a29e">Plan: Growth (₹2,499/mo)</text>

  <!-- Cafe 2 -->
  <rect x="320" y="270" width="260" height="180" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="320" y="270" width="260" height="8" rx="16" fill="url(#blue)"/>
  <text x="450" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c1917">Cafe B: "Spice Hub"</text>
  <text x="450" y="318" text-anchor="middle" font-size="10" fill="#78716c">spicehub.cafeos.app</text>
  <line x1="340" y1="330" x2="560" y2="330" stroke="#f5f5f4"/>
  <text x="340" y="348" font-size="10" fill="#57534e">Theme: Red &amp; Black</text>
  <text x="340" y="366" font-size="10" fill="#57534e">Menu: 120 items, 12 categories</text>
  <text x="340" y="384" font-size="10" fill="#57534e">Loyalty: Buy 10 Get 1 Free</text>
  <text x="340" y="402" font-size="10" fill="#57534e">WhatsApp: All 10 features</text>
  <text x="340" y="420" font-size="10" fill="#57534e">Users: Owner + 8 staff</text>
  <text x="340" y="438" font-size="10" fill="#a8a29e">Plan: Enterprise (₹4,999/mo)</text>

  <!-- Cafe 3 -->
  <rect x="610" y="270" width="260" height="180" rx="16" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <rect x="610" y="270" width="260" height="8" rx="16" fill="url(#purple)"/>
  <text x="740" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c1917">Cafe C: "Chai Point"</text>
  <text x="740" y="318" text-anchor="middle" font-size="10" fill="#78716c">chaipoint.cafeos.app</text>
  <line x1="630" y1="330" x2="850" y2="330" stroke="#f5f5f4"/>
  <text x="630" y="348" font-size="10" fill="#57534e">Theme: Green &amp; White</text>
  <text x="630" y="366" font-size="10" fill="#57534e">Menu: 30 items, 4 categories</text>
  <text x="630" y="384" font-size="10" fill="#57534e">Loyalty: Spend ₹500 Get 10% Off</text>
  <text x="630" y="402" font-size="10" fill="#57534e">WhatsApp: 3 features ON</text>
  <text x="630" y="420" font-size="10" fill="#57534e">Users: Owner only</text>
  <text x="630" y="438" font-size="10" fill="#a8a29e">Plan: Starter (₹999/mo)</text>

  <!-- Shared Codebase Box -->
  <rect x="900" y="270" width="270" height="180" rx="16" fill="white" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="900" y="270" width="270" height="8" rx="16" fill="url(#hero)"/>
  <text x="1035" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c1917">SHARED CODEBASE</text>
  <text x="1035" y="318" text-anchor="middle" font-size="10" fill="#78716c">github.com/seansap-oss/Rabi-ChaBora</text>
  <line x1="920" y1="330" x2="1150" y2="330" stroke="#fef3c7"/>
  <text x="920" y="348" font-size="10" fill="#57534e">One Vercel project</text>
  <text x="920" y="366" font-size="10" fill="#57534e">One codebase, multi-tenant</text>
  <text x="920" y="384" font-size="10" fill="#57534e">Each cafe = cafeId in DB</text>
  <text x="920" y="402" font-size="10" fill="#57534e">Shared API + database</text>
  <text x="920" y="420" font-size="10" fill="#57534e">Theme/logo/menu = per cafe</text>
  <text x="920" y="438" font-size="10" fill="#d97706" font-weight="bold">One deploy updates ALL cafes</text>

  <!-- ============================================ -->
  <!-- ROW 3: HOW EACH DISPLAY WORKS -->
  <!-- ============================================ -->
  
  <text x="30" y="495" font-size="14" font-weight="bold" fill="#1c1917">How Each Cafe Uses It</text>
  
  <!-- QR Code -->
  <rect x="30" y="510" width="170" height="120" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="115" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">QR ON TABLE</text>
  <text x="115" y="555" text-anchor="middle" font-size="10" fill="#78716c">Customer scans</text>
  <text x="115" y="572" text-anchor="middle" font-size="10" fill="#78716c">Opens menu on phone</text>
  <text x="115" y="589" text-anchor="middle" font-size="10" fill="#78716c">Places order + pays</text>
  <text x="115" y="610" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">→ Order goes to POS</text>

  <!-- POS -->
  <rect x="220" y="510" width="170" height="120" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="305" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">POS TABLET</text>
  <text x="305" y="555" text-anchor="middle" font-size="10" fill="#78716c">Staff sees new order</text>
  <text x="305" y="572" text-anchor="middle" font-size="10" fill="#78716c">Approves cash payments</text>
  <text x="305" y="589" text-anchor="middle" font-size="10" fill="#78716c">Sends to kitchen</text>
  <text x="305" y="610" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">→ Order goes to Kitchen</text>

  <!-- Kitchen -->
  <rect x="410" y="510" width="170" height="120" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="495" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">KITCHEN SCREEN</text>
  <text x="495" y="555" text-anchor="middle" font-size="10" fill="#78716c">Kanban: Received→Done</text>
  <text x="495" y="572" text-anchor="middle" font-size="10" fill="#78716c">Sound alert on new order</text>
  <text x="495" y="589" text-anchor="middle" font-size="10" fill="#78716c">Updates status in real-time</text>
  <text x="495" y="610" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">→ WhatsApp to customer</text>

  <!-- Delivery -->
  <rect x="600" y="510" width="170" height="120" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="685" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">DELIVERY SCREEN</text>
  <text x="685" y="555" text-anchor="middle" font-size="10" fill="#78716c">Out for delivery tracking</text>
  <text x="685" y="572" text-anchor="middle" font-size="10" fill="#78716c">Driver assignment</text>
  <text x="685" y="589" text-anchor="middle" font-size="10" fill="#78716c">Customer gets updates</text>
  <text x="685" y="610" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">→ Delivered + feedback</text>

  <!-- Menu Board -->
  <rect x="790" y="510" width="170" height="120" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="875" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">MENU BOARD TV</text>
  <text x="875" y="555" text-anchor="middle" font-size="10" fill="#78716c">Digital signage display</text>
  <text x="875" y="572" text-anchor="middle" font-size="10" fill="#78716c">Auto-rotates specials</text>
  <text x="875" y="589" text-anchor="middle" font-size="10" fill="#78716c">Shows all items + prices</text>
  <text x="875" y="610" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">→ Customers see on screen</text>

  <!-- Admin -->
  <rect x="980" y="510" width="170" height="120" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="1065" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1917">ADMIN DASHBOARD</text>
  <text x="1065" y="555" text-anchor="middle" font-size="10" fill="#78716c">Sales charts + reports</text>
  <text x="1065" y="572" text-anchor="middle" font-size="10" fill="#78716c">Loyalty program mgmt</text>
  <text x="1065" y="589" text-anchor="middle" font-size="10" fill="#78716c">Menu + settings control</text>
  <text x="1065" y="610" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">→ Full control center</text>

  <!-- ============================================ -->
  <!-- ROW 4: BUSINESS MODEL -->
  <!-- ============================================ -->
  
  <text x="30" y="675" font-size="14" font-weight="bold" fill="#1c1917">Business Model: How You Sell It</text>
  
  <!-- Starter -->
  <rect x="30" y="695" width="260" height="100" rx="12" fill="white" stroke="#d6d3d1" filter="url(#shadow)"/>
  <text x="45" y="720" font-size="12" font-weight="bold" fill="#1c1917">STARTER</text>
  <text x="45" y="740" font-size="11" fill="#d97706" font-weight="bold">₹999/mo</text>
  <text x="140" y="740" font-size="10" fill="#78716c">QR + POS + Menu</text>
  <text x="45" y="760" font-size="10" fill="#78716c">For: Small cafes, 1-2 person team</text>
  <text x="45" y="778" font-size="10" fill="#78716c">Upsell: "Add Kitchen Display for ₹500"</text>

  <!-- Growth -->
  <rect x="320" y="695" width="260" height="100" rx="12" fill="white" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <rect x="320" y="695" width="260" height="6" rx="12" fill="url(#hero)"/>
  <text x="335" y="720" font-size="12" font-weight="bold" fill="#1c1917">GROWTH</text>
  <text x="335" y="740" font-size="11" fill="#f97316" font-weight="bold">₹2,499/mo</text>
  <text x="430" y="740" font-size="10" fill="#78716c">+ Kitchen + Delivery + Loyalty</text>
  <text x="335" y="760" font-size="10" fill="#78716c">For: Growing restaurants, 3-5 staff</text>
  <text x="335" y="778" font-size="10" fill="#78716c">Upsell: "Add WhatsApp for ₹500"</text>

  <!-- Enterprise -->
  <rect x="610" y="695" width="260" height="100" rx="12" fill="white" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="720" font-size="12" font-weight="bold" fill="#1c1917">ENTERPRISE</text>
  <text x="625" y="740" font-size="11" fill="#7c3aed" font-weight="bold">₹4,999/mo</text>
  <text x="720" y="740" font-size="10" fill="#78716c">Everything + Social + Reports</text>
  <text x="625" y="760" font-size="10" fill="#78716c">For: Multi-outlet chains</text>
  <text x="625" y="778" font-size="10" fill="#78716c">Upsell: "Custom APK for ₹50K one-time"</text>

  <!-- Add-ons -->
  <rect x="900" y="695" width="270" height="100" rx="12" fill="white" stroke="#e7e5e4" filter="url(#shadow)"/>
  <text x="915" y="720" font-size="12" font-weight="bold" fill="#1c1917">ADD-ONS (à la carte)</text>
  <text x="915" y="740" font-size="10" fill="#57534e">WhatsApp Full: ₹500/mo</text>
  <text x="915" y="758" font-size="10" fill="#57534e">Facebook + Instagram: ₹300/mo</text>
  <text x="915" y="776" font-size="10" fill="#57534e">Custom APK: ₹50,000 one-time</text>
  <text x="915" y="792" font-size="10" fill="#57534e">Priority Support: ₹200/mo</text>

  <!-- ============================================ -->
  <!-- ROW 5: FLOW DIAGRAM -->
  <!-- ============================================ -->
  
  <text x="30" y="840" font-size="14" font-weight="bold" fill="#1c1917">Data Flow (Multi-Tenant)</text>
  
  <!-- Boxes -->
  <rect x="30" y="860" width="160" height="30" rx="8" fill="url(#hero)"/>
  <text x="110" y="880" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Cafe's Phone/Tablet</text>
  
  <rect x="230" y="860" width="160" height="30" rx="8" fill="url(#blue)"/>
  <text x="310" y="880" text-anchor="middle" font-size="10" fill="white" font-weight="bold">CafeOS Vercel App</text>
  
  <rect x="430" y="860" width="160" height="30" rx="8" fill="url(#green)"/>
  <text x="510" y="880" text-anchor="middle" font-size="10" fill="white" font-weight="bold">API + Database</text>
  
  <rect x="630" y="860" width="160" height="30" rx="8" fill="url(#purple)"/>
  <text x="710" y="880" text-anchor="middle" font-size="10" fill="white" font-weight="bold">WhatsApp Business API</text>
  
  <rect x="830" y="860" width="160" height="30" rx="8" fill="url(#rose)"/>
  <text x="910" y="880" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Facebook + Instagram API</text>
  
  <rect x="1030" y="860" width="140" height="30" rx="8" fill="#1c1917"/>
  <text x="1100" y="880" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Customer's Phone</text>
  
  <!-- Arrows -->
  <line x1="190" y1="875" x2="230" y2="875" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="875" x2="430" y2="875" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="875" x2="630" y2="875" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="875" x2="830" y2="875" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="990" y1="875" x2="1030" y2="875" stroke="#d6d3d1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>